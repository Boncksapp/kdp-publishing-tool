services:
  - type: web
    name: kdp-publishing-tool
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    healthCheckPath: /
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000